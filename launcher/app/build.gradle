plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'app.cash.paparazzi'
}

def household = project.hasProperty('household') ? project.property('household').toString().trim() : ''
def privDir = household ? rootProject.file("../private/${household}") : null
if (privDir != null && !privDir.exists()) {
    throw new GradleException("Household folder not found: ${privDir}")
}

def restoreAssets = file("${rootProject.ext.outDir}/restore-assets")
def copyRestore = tasks.register('copyRestoreScript', Sync) {
    def privRestore = privDir != null ? new File(privDir, 'restore.sh') : null
    from (privRestore != null && privRestore.exists() ? privRestore : rootProject.file('../restore.sh'))
    from rootProject.file('../streams.json')
    if (privDir != null && new File(privDir, 'custom_scene').exists()) {
        from(new File(privDir, 'custom_scene')) {
            into 'custom_scene'
        }
    }
    into restoreAssets
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn copyRestore }

// Signing key + passwords: launcher/keystore.jks, launcher/keystore.properties (committed on purpose; private repo)
def ks = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'au.internal.home'
    compileSdk 34
    defaultConfig {
        applicationId 'au.internal.home'
        minSdk 26
        targetSdk 34
        // CalVer: YY.MM.DD.N (versionCode = YYMMDDNN, strictly increasing)
        versionCode 26112703
        versionName "26.11.27.3"
    }
    signingConfigs {
        release {
            storeFile rootProject.file('keystore.jks')
            storePassword ks['storePassword']
            keyAlias ks['keyAlias']
            keyPassword ks['keyPassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    // The repo's restore.sh is built in as an asset: Home's "Put the TV back" button runs the very same file.
    sourceSets {
        main { assets.srcDir restoreAssets }
        if (privDir != null && new File(privDir, 'res').exists()) {
            def privRes = new File(privDir, 'res')
            release { res.srcDir privRes }
            debug { res.srcDir privRes }
        }
    }
}

dependencies {
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    testImplementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}

// Paparazzi records into src/test/snapshots by default; keep its screenshots with the rest of the build output in
// RAM (see ../build.gradle). Set as the task starts: the plugin sets its own value later in configuration.
tasks.withType(Test).configureEach {
    doFirst { systemProperty 'paparazzi.snapshot.dir', "${rootProject.ext.outDir}/snapshots" }
}
